<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document Desk</title>
		<style>
			:root {
				color: #1b2b2a;
				background: #edf2ef;
				font-family: "Trebuchet MS", Verdana, sans-serif;
				font-synthesis: none;
			}

			* { box-sizing: border-box; }
			body { margin: 0; background: linear-gradient(135deg, #edf2ef 0%, #f6f4ee 100%); }
			main { width: min(1120px, 100%); margin: auto; padding: 48px 28px; }
			h1, h2, p { margin: 0; }
			h1 { font-family: Georgia, serif; font-size: clamp(2.8rem, 6vw, 5.4rem); line-height: .98; letter-spacing: 0; }
			h2 { font-family: Georgia, serif; font-size: 1.7rem; line-height: 1.1; }
			.auth { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
			.eyebrow { color: #18756e; font-size: .72rem; font-weight: 700; letter-spacing: 2px; }
			.muted, small { color: #6c7975; }
			.card { background: #fffdf9; border: 1px solid #d9e0da; border-radius: 14px; padding: 32px; box-shadow: 0 16px 40px rgba(32, 57, 52, .08); }
			.auth-card { width: min(100%, 560px); padding: 44px; }
			.auth-switch { display: flex; justify-content: flex-end; align-items: center; gap: 6px; color: #6c7975; font-size: .82rem; }
			.link-button { margin: 0; padding: 0; border: 0; background: transparent; color: #18756e; font-size: inherit; }
			.link-button:hover:not(:disabled) { background: transparent; color: #105e59; transform: none; text-decoration: underline; }
			.auth-card h2 { margin: 30px 0 24px; }
			label { display: block; color: #40524f; font-size: .82rem; font-weight: 700; }
			input { display: block; width: 100%; margin: 8px 0 18px; padding: 13px 14px; border: 1px solid #cfd9d2; border-radius: 7px; background: #fff; color: #1b2b2a; font: inherit; }
			select { display: block; width: 100%; margin: 8px 0 18px; padding: 13px 14px; border: 1px solid #cfd9d2; border-radius: 7px; background: #fff; color: #1b2b2a; font: inherit; }
			input:focus { outline: 3px solid rgba(24, 117, 110, .14); border-color: #18756e; }
			select:focus { outline: 3px solid rgba(24, 117, 110, .14); border-color: #18756e; }
			select:disabled { cursor: not-allowed; background: #f2f4f1; color: #8a9690; }
			button { margin-top: 14px; padding: 12px 17px; border: 1px solid transparent; border-radius: 7px; background: #18756e; color: #fff; font: inherit; font-weight: 700; cursor: pointer; transition: transform .15s ease, background .15s ease; }
			button:hover:not(:disabled) { background: #105e59; transform: translateY(-1px); }
			button:disabled { cursor: not-allowed; opacity: .55; }
			.primary { width: 100%; }
			.outline { background: transparent; color: #18756e; border-color: #b8cbc2; }
			.outline:hover:not(:disabled) { background: #e7f0eb; color: #105e59; }
			.message { margin-top: 16px; padding: 11px 12px; border-radius: 7px; background: #edf5f0; color: #236c4d; font-size: .88rem; }
			.card > small { display: block; margin-top: 18px; font-size: .78rem; line-height: 1.5; }
			.header { display: flex; justify-content: space-between; align-items: end; gap: 24px; padding-bottom: 28px; border-bottom: 1px solid #d4ded7; }
			.header-left { display: flex; align-items: flex-start; gap: 18px; min-width: 0; }
			.header h1 { margin-top: 10px; font-size: clamp(2.3rem, 5vw, 4.6rem); }
			.signout { margin: 0 0 4px; }
			.grid { display: flex; flex-direction: column; gap: 24px; margin-top: 24px; }
			.chat-callout { display: inline-flex; align-items: center; gap: 8px; flex-shrink: 0; margin: 4px 0 0; padding: 9px 12px; border: 1px solid #b8cbc2; border-radius: 8px; background: #fffdf9; color: #18756e; font-size: .78rem; box-shadow: none; }
			.chat-callout:hover { background: #e7f0eb; color: #105e59; transform: none; box-shadow: none; }
			.chat-callout-icon { font-size: .9rem; line-height: 1; }
			.stat-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; margin-top: 20px; }
			.stat-card { padding: 16px 18px; border-radius: 12px; background: #fffdf9; border: 1px solid #e1e7e2; border-left: 4px solid #cfd9d2; }
			.stat-card strong { display: block; font-size: 1.8rem; font-family: Georgia, serif; }
			.stat-card span { font-size: .78rem; color: #6c7975; }
			.stat-card.status-signed { border-left-color: #1f7a4d; }
			.stat-card.status-expiring { border-left-color: #b5451f; }
			.stat-card.status-pending { border-left-color: #a6690f; }
			.stat-card.status-expired { border-left-color: #8b3838; }
			.search-input { margin: 16px 0 0; }
			.show-more { display: block; margin: 16px auto 0; padding: 8px 16px; font-size: .78rem; }
			.documents-card { min-width: 0; }
			.compact-list { max-height: 300px; overflow-y: auto; }
			.upload-card { border-top: 4px solid #18756e; }
			.upload-heading { display: flex; align-items: start; justify-content: space-between; gap: 16px; }
			.upload-heading h2 { margin-top: 8px; }
			.file-limit { padding: 6px 9px; border-radius: 5px; background: #edf5f0; color: #387443; font-size: .7rem; font-weight: 700; white-space: nowrap; }
			.drop { display: flex; flex-direction: column; min-height: 220px; margin: 28px 0 0; padding: 28px 18px; align-items: center; justify-content: center; gap: 10px; border: 1.5px dashed #8eafa2; border-radius: 12px; background: #f7faf7; color: #40524f; text-align: center; cursor: pointer; transition: border-color .15s ease, background .15s ease, transform .15s ease; }
			.drop:hover { border-color: #18756e; background: #f0f8f4; transform: translateY(-1px); }
			.drop strong { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			.drop small { font-size: .76rem; font-weight: 400; }
			.drop input { display: none; }
			.upload-icon { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 50%; background: #dcece5; color: #18756e; font-size: 1.5rem; line-height: 1; }
			.heading, li { display: flex; justify-content: space-between; gap: 18px; }
			.heading { align-items: center; }
			.heading-actions { display: flex; align-items: center; gap: 12px; }
			.heading h2 { margin-top: 8px; }
			.count { display: grid; place-items: center; min-width: 36px; height: 36px; border-radius: 50%; background: #f2e2d8; color: #a64c37; }
			ul { list-style: none; margin: 26px 0 0; padding: 0; }
			li { align-items: center; padding: 17px 0; border-top: 1px solid #e1e7e2; }
			li small, li b { display: block; }
			li b { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
			li small { margin-top: 5px; font-size: .76rem; }
			em { color: #387443; font-style: normal; font-size: .7rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
			.document-actions { display: flex; align-items: center; gap: 10px; }
			.status-badge { padding: 3px 9px; border-radius: 20px; font-size: .68rem; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; }
			.status-signed { background: #e4f3ea; color: #1f7a4d; }
			.status-pending { background: #fdf1de; color: #a6690f; }
			.status-expiring { background: #fde8e3; color: #b5451f; }
			.status-expired { background: #f1e2e2; color: #8b3838; }
			.preview-link { margin: 0; padding: 6px 10px; font-size: .72rem; }
			.submit-link { margin: 0; padding: 8px 11px; font-size: .72rem; }
			.report-card { min-width: 0; }
			.approval-form { max-width: 720px; margin: 30px auto 0; }
			.approval-form h2 { margin-top: 8px; }
			.form-help { max-width: 560px; margin-top: 10px; color: #6c7975; font-size: .86rem; line-height: 1.5; }
			.share-controls { margin-top: 18px; padding-top: 18px; border-top: 1px solid #e1e7e2; }
			.share-controls > button { margin-top: 0; }
			.share-link-row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
			.share-link-row input { flex: 1; min-width: 0; margin: 0; color: #6c7975; font-size: .78rem; }
			.share-link-row button { flex-shrink: 0; margin: 0; }
			.shared-contract-details { display: grid; gap: 5px; margin-top: 20px; padding: 16px; border-left: 3px solid #18756e; background: #f2f6f2; color: #40524f; }
			.shared-contract-details strong { color: #1b2b2a; }
			.report-table-wrap { overflow-x: auto; margin-top: 20px; }
			.report-table { width: 100%; border-collapse: collapse; font-size: .82rem; }
			.report-table th { text-align: left; padding: 8px 10px; border-bottom: 2px solid #d9e0da; color: #40524f; }
			.report-table td { padding: 10px; border-bottom: 1px solid #ece7dc; vertical-align: top; }
			.report-table td b { display: block; }
			.report-table td small { display: block; margin-top: 2px; color: #6c7975; }
			.stage-list { margin: 0; padding-left: 18px; }
			.stage-pips { display: flex; gap: 6px; }
			.stage-pip { position: relative; display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: #eef1ee; color: #6c7975; font-size: .72rem; font-weight: 700; cursor: help; }
			.stage-pip::after { position: absolute; z-index: 2; bottom: calc(100% + 8px); left: 50%; width: max-content; max-width: 240px; padding: 8px 10px; border-radius: 6px; background: #1b2b2a; color: #fff; content: attr(data-tooltip); font-size: .7rem; font-weight: 400; line-height: 1.35; opacity: 0; pointer-events: none; transform: translate(-50%, 4px); transition: opacity .15s ease, transform .15s ease; }
			.stage-pip:hover::after, .stage-pip:focus-visible::after { opacity: 1; transform: translate(-50%, 0); }
			.stage-pip.stage-completed { background: #e4f3ea; color: #1f7a4d; }
			.stage-pip.stage-in-progress { background: #fdf1de; color: #a6690f; }
			.stage-pip.stage-not-started { background: #eef1ee; color: #98a29c; }
			.stage-pip.stage-delayed { background: #fde8e3; color: #b5451f; box-shadow: 0 0 0 2px #f2b7a5 inset; }
			.back-link { margin: 0 0 20px; padding: 0; border: 0; background: transparent; color: #18756e; font-size: .82rem; }
			.back-link:hover:not(:disabled) { background: transparent; color: #105e59; transform: none; text-decoration: underline; }
			.chat-user { align-self: end; margin-bottom: 5px; color: #6c7975; font-size: .8rem; }
			.chat-panel { max-width: 850px; margin: 30px auto 0; padding: 26px; }
			.chat-messages { display: flex; min-height: 420px; max-height: 58vh; overflow-y: auto; flex-direction: column; gap: 16px; padding: 4px; }
			.chat-message { max-width: 78%; padding: 14px 16px; border-radius: 10px; line-height: 1.55; font-size: .92rem; }
			.chat-message p { white-space: pre-wrap; }
			.chat-message.user { align-self: end; background: #18756e; color: #fff; border-bottom-right-radius: 3px; }
			.chat-message.assistant { align-self: start; background: #f0f5f1; color: #40524f; border-bottom-left-radius: 3px; }
			.chat-message.error { background: #fff0eb; color: #8b3828; }
			.message-label { display: block; margin-bottom: 5px; font-size: .68rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; opacity: .72; }
			.typing { color: #6c7975; font-style: italic; }
			.chat-composer { display: flex; gap: 10px; margin-top: 18px; padding-top: 18px; border-top: 1px solid #e1e7e2; }
			.chat-composer input { margin: 0; }
			.chat-composer button { width: auto; min-width: 84px; margin: 0; }
			.chat-note { display: block; margin-top: 12px; font-size: .74rem; }
			@media (max-width: 760px) {
				main { padding: 28px 18px; }
				.auth { padding-top: 20px; }
				.auth-card { padding: 28px 22px; }
				.header { align-items: start; }
				.header h1 { font-size: 2.6rem; }
				.chat-input { flex-direction: column; }
				.chat-input button { width: 100%; }
				.document-actions { align-items: end; flex-direction: column; gap: 6px; }
				.heading-actions { align-items: end; flex-direction: column-reverse; gap: 8px; }
				.header-left { align-items: stretch; flex-direction: column; gap: 16px; }
				.chat-callout { align-self: flex-start; margin-top: 0; }
				.chat-message { max-width: 92%; }
				.chat-composer { flex-direction: column; }
				.chat-composer button { width: 100%; }
				.share-link-row { align-items: stretch; flex-direction: column; }
				.share-link-row button { width: 100%; }
			}
		</style>
	</head>
	<body><div id="root"></div><script type="module" src="/src/app.jsx"></script></body>
</html>
